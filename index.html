<style>
:root{
  --bg:#030305;--card:#0b0b0f;--line:#1a1a22;--text:#f8f6f0;--muted:#8c887d;--gold:#f3b825;
  --serif:'Playfair Display',Georgia,serif;--sans:'Cairo',system-ui,sans-serif;
  --input-bg:#07070a;--input-border:#20202a;
  --gold2:#ffe585;--glass:rgba(11,11,15,.88);--glow:0 0 90px rgba(243,184,37,.25);
  --gold-grad:linear-gradient(135deg,#ffea9f 0%,#f3b825 48%,#9e6b05 100%);
  --royal-dark:#030305;
}
body.light-mode{
  --bg:#f4f4f7;--card:#ffffff;--line:#dedee6;--text:#121216;--muted:#666675;--gold:#c98e10;
  --input-bg:#f0f0f5;--input-border:#cccccc;
  --glass:rgba(255,255,255,.92);--glow:0 12px 45px rgba(201,142,16,.18);
  --gold-grad:linear-gradient(135deg,#e8b438,#c98e10 50%,#875b03);
  --royal-dark:#f4f4f7;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--sans);transition:background .3s ease,color .3s ease,border-color .3s ease}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;overflow-x:hidden;position:relative;line-height:1.6}
a{color:inherit;text-decoration:none}
em{font-family:var(--serif);font-style:italic;color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2}
.hidden{display:none!important}

body::before{content:"";position:fixed;z-index:0;pointer-events:none;width:80vmax;height:80vmax;border-radius:50%;filter:blur(130px);opacity:.22;top:-35vmax;right:-25vmax;background:radial-gradient(circle,#f3b825,transparent 65%);animation:blobMove 18s ease-in-out infinite alternate}
@keyframes blobMove{to{transform:translate(7vmax,9vmax) scale(1.15)}}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--gold-grad);border-radius:99px}
::selection{background:var(--gold);color:#111}

#introScreen{position:fixed;inset:0;background:var(--royal-dark);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;overflow:hidden;transition:opacity 1.2s cubic-bezier(.4,0,.2,1),visibility 1.2s;}
.intro-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.4) contrast(1.25);animation:introZoom 4s ease-out forwards;}
@keyframes introZoom{0%{transform:scale(1.1)}100%{transform:scale(1.0)}}

.headlight-glow{position:absolute;width:240px;height:130px;background:radial-gradient(ellipse,rgba(255,235,130,.9) 0%,rgba(243,184,37,.45) 40%,transparent 75%);filter:blur(16px);top:45%;left:35%;transform:translate(-50%,-50%);animation:flashHeadlight 3.5s ease-in-out infinite;pointer-events:none;z-index:2;}
.headlight-glow.right{left:65%;}
@keyframes flashHeadlight{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(.95);}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}}

.intro-smoke{position:absolute;bottom:0;left:0;width:100%;height:180px;pointer-events:none;overflow:hidden;z-index:3;}
.intro-puff{position:absolute;bottom:-30px;background:radial-gradient(circle,rgba(255,255,255,.32) 0%,rgba(243,184,37,.15) 45%,transparent 75%);border-radius:50%;filter:blur(12px);animation:introSmokeRise 3.5s ease-out infinite;}
@keyframes introSmokeRise{0%{transform:translateY(0) scale(.4);opacity:0;}40%{opacity:.6;}100%{transform:translateY(-160px) scale(3.2);opacity:0;}}

.intro-content{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center;animation:fadeInIntro 1.5s ease-out forwards;}
.intro-brand{font-family:var(--serif);font-size:clamp(40px,8vw,78px);font-weight:700;letter-spacing:5px;color:#fff

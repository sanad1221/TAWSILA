<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAWSILA - Gasser Ultra Luxury Edition</title>

    <!-- استدعاء مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #050508 0%, #0d0d15 50%, #020204 100%);
            --text-color: #ffffff;
            --card-bg: rgba(18, 18, 26, 0.85);
            --border-color: rgba(255, 204, 0, 0.3);
            --nav-bg: rgba(11, 11, 15, 0.95);
            --subtext-color: #a0a0a5;
            --input-bg: #0b0b0f;
            --input-border: #2a2a3a;
        }

        body.light-mode {
            --bg-gradient: linear-gradient(135deg, #f0f2f5 0%, #e2e8f0 50%, #cbd5e1 100%);
            --text-color: #1e293b;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(217, 119, 6, 0.4);
            --nav-bg: rgba(255, 255, 255, 0.95);
            --subtext-color: #475569;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* شاشة الإنترو الفخمة */
        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #020204;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            transition: opacity 0.6s ease;
        }

        .intro-abstract-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255,204,0,0.2) 0%, rgba(11,11,18,0.98) 70%);
            animation: abstractPulse 2s ease-in-out infinite alternate;
        }

        @keyframes abstractPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        .snapshot-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            animation: fadeInTitle 0.8s ease-in-out forwards;
        }

        .snapshot-title {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffcc00, #00f2fe, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 6px;
            text-shadow: 0 0 35px rgba(255, 204, 0, 0.6);
            margin-bottom: 5px;
        }

        .snapshot-subtitle {
            font-size: 14px;
            color: #a0a0a5;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        @keyframes fadeInTitle {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* مطر اسم Gasser في الخلفية */
        .gasser-rain {
            position: absolute;
            top: -30px;
            color: rgba(255, 204, 0, 0.15);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            user-select: none;
            pointer-events: none;
            animation: fallRain linear infinite;
            z-index: 1;
        }

        @keyframes fallRain {
            0% { transform: translateY(-30px); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        /* تأثير الفقاعات عند اللمس */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 204, 0, 0.4);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
            z-index: 998;
        }

        @keyframes rippleEffect {
            to { transform: scale(4); opacity: 0; }
        }

        .touch-tuktuk {
            position: absolute;
            font-size: 28px;
            pointer-events: none;
            z-index: 999;
            transition: all 0.8s ease-out;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 1;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffcc00, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }

        .nav-buttons-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle-btn {
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid #ffcc00;
            color: #ffcc00;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .theme-toggle-btn:hover {
            background: #ffcc00;
            color: #000;
            box-shadow: 0 0 10px #ffcc00;
        }

        .top-logout-btn {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .top-logout-btn:hover {
            background: #ff4d4d;
            color: #fff;
            box-shadow: 0 0 10px #ff4d4d;
        }

        .container {
            max-width: 900px;
            margin: 110px auto 40px auto;
            padding: 15px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.1);
            text-align: center;
        }

        .card h1, .card h2 {
            font-size: 28px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ffcc00, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card p {
            color: var(--subtext-color);
            font-size: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--subtext-color);
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 15px;
        }

        .form-group input[type="file"] {
            padding: 8px;
            background: rgba(255, 204, 0, 0.05);
            border: 1px dashed rgba(255, 204, 0, 0.4);
            cursor: pointer;
        }

        .action-btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #ffcc00;
            background: transparent;
            color: #ffcc00;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.4s;
            width: 100%;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            background: #ffcc00;
            color: #0b0b0f;
            box-shadow: 0 0 15px #ffcc00;
        }

        /* السلايدات الفاخرة للسيارات */
        .slider-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            margin: 20px 0;
            padding: 10px 5px;
        }

        .slider-track {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: #ffcc00 #11111b;
        }

        .slider-track::-webkit-scrollbar {
            height: 8px;
        }
        .slider-track::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #ffcc00, #00f2fe);
            border-radius: 10px;
        }

        .fleet-card {
            min-width: 210px;
            flex: 0 0 auto;
            background: linear-gradient(145deg, rgba(30, 30, 45, 0.7), rgba(15, 15, 25, 0.85));
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 204, 0, 0.25);
            border-radius: 22px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .fleet-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #ffcc00;
            box-shadow: 0 15px 35px rgba(255, 204, 0, 0.3);
        }

        .fleet-card.selected {
            border-color: #00f2fe;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            background: linear-gradient(145deg, rgba(0, 242, 254, 0.15), rgba(18, 18, 26, 0.95));
            transform: translateY(-5px);
        }

        .fleet-icon {
            font-size: 52px;
            margin-bottom: 12px;
            display: block;
            filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.5));
        }

        .fleet-title {
            font-size: 17px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
        }

        .fleet-desc {
            font-size: 12px;
            color: #a0a0b0;
        }

        /* السلايدين الكبار الفخمين */
        .big-mode-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 25px 0;
        }

        .big-mode-card {
            flex: 1;
            background: linear-gradient(145deg, rgba(25, 25, 40, 0.8), rgba(12, 12, 20, 0.95));
            border: 2px solid rgba(255, 204, 0, 0.3);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .big-mode-card:hover {
            transform: translateY(-6px);
            border-color: #ffcc00;
            box-shadow: 0 15px 35px rgba(255, 204, 0, 0.25);
        }

        .big-mode-card.selected {
            border-color: #00f2fe;
            background: linear-gradient(145deg, rgba(0, 242, 254, 0.15), rgba(15, 15, 25, 0.98));
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
        }

        .big-mode-icon {
            font-size: 44px;
            margin-bottom: 12px;
            display: block;
        }

        .big-mode-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
        }

        .big-mode-desc {
            font-size: 13px;
            color: #aaa;
        }

        /* نظام النجوم للتقييم */
        .star-rating {
            display: flex;
            gap: 8px;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            margin: 10px 0;
        }
        .star {
            color: #444;
            transition: 0.2s;
        }
        .star.rated {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
        }

        .social-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .social-btn {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .fb-btn { background: rgba(24, 119, 242, 0.15); border: 1px solid #1877f2; color: #1877f2; }
        .fb-btn:hover { background: #1877f2; color: #fff; }

        .ig-btn { background: rgba(225, 48, 108, 0.15); border: 1px solid #e1306c; color: #e1306c; }
        .ig-btn:hover { background: #e1306c; color: #fff; }

        .btn-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .creator-box {
            margin: 20px 0;
            padding: 20px 10px;
            background: rgba(255, 204, 0, 0.03);
            border: 2px solid rgba(255, 204, 0, 0.4);
            border-radius: 16px;
        }

        .creator-name {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffcc00, #ffffff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .wallet-box {
            background: rgba(255, 204, 0, 0.08);
            border: 1px solid #ffcc00;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: right;
        }

        .admin-stat-card {
            background: rgba(255, 0, 0, 0.05);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: right;
        }

        .hidden { display: none; }
        
        .driver-offer-box {
            background: rgba(25, 25, 35, 0.8);
            border-left: 4px solid #ffcc00;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            text-align: right;
        }

        .schedule-offer-box {
            background: rgba(255, 204, 0, 0.06);
            border: 2px solid #ffcc00;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
            text-align: right;
        }

        .creator-footer {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #777;
            border-top: 1px solid #1a1a22;
            position: relative;
            z-index: 2;
            background: var(--nav-bg);
        }
        .creator-footer span { color: #ffcc00; font-weight: bold; }
    </style>
</head>
